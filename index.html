<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ClickRobot by Kru ICE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14181D; --surface:#1B2028; --surface-2:#232A33; --surface-3:#2A323D;
    --border:#2C3440; --text:#E9EBEE; --text-dim:#8F97A5; --text-faint:#5B6472;
    --ev3:#E8543E; --wedo:#4FB89C; --vex:#7A8CD4;
    --amber:#F2A93B; --success:#5FBF7A; --danger:#E8543E;
    --radius:12px; --radius-sm:7px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans Thai',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:90px;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;}
  input{font-family:inherit;}
  a{color:inherit;}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:30;
    background:var(--bg);
    border-bottom:2px solid var(--border);
    padding:16px 20px 18px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap;
  }
  .topbar::after{
    content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background-image:radial-gradient(circle, var(--amber) 1.4px, transparent 1.5px);
    background-size:22px 1px; background-repeat:repeat-x; opacity:.55;
  }
  .brand{display:flex; align-items:baseline; gap:8px;}
  .brand-name{font-size:20px; font-weight:700; letter-spacing:.2px;}
  .brand-sub{font-size:12px; color:var(--text-faint); font-weight:500;}
  .branch-select-wrap{display:flex; align-items:center; gap:10px;}
  .branch-select-wrap label{font-size:12px; color:var(--text-dim); white-space:nowrap;}
  select#branchSelect{
    background:var(--surface-2); color:var(--text); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:9px 12px; font-size:14px; font-weight:500;
    min-width:170px; cursor:pointer;
  }
  select#branchSelect:focus{outline:2px solid var(--amber); outline-offset:1px;}

  /* ---------- Setup banner ---------- */
  .setup-banner{
    margin:14px 20px 0; padding:11px 14px; border-radius:var(--radius-sm);
    background:#3A2A16; border:1px solid #6B4A22; color:#F2C98B; font-size:13px; line-height:1.5;
  }
  .setup-banner code{background:#00000030; padding:1px 6px; border-radius:4px; font-family:'IBM Plex Mono',monospace;}

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex; gap:4px; padding:14px 20px 0; overflow-x:auto;
  }
  .tab{
    display:flex; align-items:center; gap:8px;
    background:transparent; border:1px solid var(--border); color:var(--text-dim);
    padding:9px 16px; border-radius:999px; font-size:13.5px; font-weight:600; cursor:pointer;
    white-space:nowrap; transition:all .15s ease;
  }
  .tab .dot{width:6px; height:6px; border-radius:50%; background:var(--text-faint); transition:all .25s ease;}
  .tab .count{font-family:'IBM Plex Mono',monospace; font-weight:500; opacity:.6; font-size:11.5px;}
  .tab:hover{border-color:var(--surface-3); color:var(--text);}
  .tab.active{color:var(--text); background:var(--surface); border-color:var(--surface-3);}
  .tab[data-cat="ev3"].active{color:var(--ev3);}
  .tab[data-cat="wedo"].active{color:var(--wedo);}
  .tab[data-cat="vexiq"].active{color:var(--vex);}
  .tab.active .dot{background:currentColor; box-shadow:0 0 8px currentColor;}

  /* ---------- Toolbar / search ---------- */
  .toolbar{padding:14px 20px 0;}
  .search-wrap{position:relative; max-width:420px;}
  .search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.5;}
  input#searchBox{
    width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:10px 14px 10px 38px; border-radius:var(--radius-sm); font-size:13.5px;
  }
  input#searchBox:focus{outline:2px solid var(--amber); outline-offset:1px;}

  /* ---------- Content ---------- */
  main#content{padding:18px 20px 20px;}
  .parts-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(196px, 1fr)); gap:12px;
  }
  .part-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .part-img{
    position:relative; aspect-ratio:4/3; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .part-img img{width:100%; height:100%; object-fit:contain; padding:10px;}
  .part-img .fallback-label{
    display:none; padding:10px; text-align:center; font-size:11px; color:var(--text-faint); line-height:1.4;
  }
  .part-img.no-image .fallback-label,
  .part-img.img-error .fallback-label{display:flex; align-items:center; justify-content:center;}
  .part-img.no-image img,
  .part-img.img-error img{display:none;}
  .color-dot{
    position:absolute; top:8px; right:8px; width:12px; height:12px; border-radius:50%;
    border:2px solid #00000055;
  }
  .part-info{padding:10px 12px 4px; flex:1;}
  .part-name{font-size:13px; font-weight:600; line-height:1.35; margin-bottom:5px;}
  .part-meta{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .part-num{font-size:11.5px; color:var(--amber); font-weight:500;}
  .part-color{font-size:11px; color:var(--text-faint);}
  .part-existing{
    margin-top:6px; font-size:11px; color:var(--text-dim);
    background:var(--surface-2); display:inline-block; padding:2px 8px; border-radius:999px;
  }
  .bl-links{display:flex; gap:10px; margin-top:7px;}
  .bl-links a{font-size:10.5px; color:var(--vex); text-decoration:none; border-bottom:1px dotted var(--vex);}
  .bl-links a:hover{opacity:.8;}
  .part-qty{
    display:flex; align-items:center; gap:0; margin:10px 12px 12px; border:1px solid var(--border);
    border-radius:var(--radius-sm); overflow:hidden;
  }
  .qty-btn{
    background:var(--surface-2); border:none; color:var(--text); width:34px; height:34px;
    font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .qty-btn:hover{background:var(--surface-3);}
  .qty-btn:active{background:var(--border);}
  .qty-input{
    flex:1; min-width:0; text-align:center; background:var(--bg); border:none; color:var(--text);
    font-size:14px; font-weight:600; height:34px; border-left:1px solid var(--border); border-right:1px solid var(--border);
  }
  .qty-input:focus{outline:none; background:var(--surface-2);}
  .qty-input::-webkit-outer-spin-button,.qty-input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}

  /* ---------- Empty states ---------- */
  .empty-state{
    padding:60px 20px; text-align:center; color:var(--text-faint); font-size:14px; line-height:1.7;
  }

  /* ---------- Summary table ---------- */
  .summary-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius);}
  table.summary-table{width:100%; border-collapse:collapse; font-size:13px; min-width:720px;}
  table.summary-table th{
    text-align:left; padding:11px 12px; background:var(--surface-2); color:var(--text-dim);
    font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;
    border-bottom:1px solid var(--border); white-space:nowrap;
  }
  table.summary-table td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
  table.summary-table tr:last-child td{border-bottom:none;}
  table.summary-table tr:hover td{background:var(--surface);}
  .cat-tag{
    display:inline-block; margin-left:8px; font-size:10px; font-weight:600; padding:1px 7px;
    border-radius:999px; vertical-align:middle;
  }
  .cat-tag.ev3{background:#E8543E22; color:var(--ev3);}
  .cat-tag.wedo{background:#4FB89C22; color:var(--wedo);}
  .cat-tag.vexiq{background:#7A8CD422; color:var(--vex);}
  .total-cell{font-weight:700; color:var(--amber);}

  /* ---------- Cart FAB ---------- */
  .cart-fab{
    position:fixed; right:20px; bottom:20px; z-index:40;
    background:var(--amber); color:#1B1300; border:none; border-radius:999px;
    padding:14px 20px; display:flex; align-items:center; gap:9px; cursor:pointer;
    font-size:14px; font-weight:700; box-shadow:0 6px 20px #00000055;
    transition:transform .15s ease;
  }
  .cart-fab:hover{transform:translateY(-2px);}
  .cart-fab .badge{
    background:#1B1300; color:var(--amber); border-radius:999px; padding:2px 9px;
    font-family:'IBM Plex Mono',monospace; font-size:13px; min-width:22px; text-align:center;
  }

  /* ---------- Drawer ---------- */
  .overlay{
    position:fixed; inset:0; background:#00000070; z-index:49; opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; right:0; bottom:0; width:min(420px, 100vw); z-index:50;
    background:var(--surface); border-left:1px solid var(--border);
    transform:translateX(100%); transition:transform .25s ease;
    display:flex; flex-direction:column;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-header{
    padding:18px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;
  }
  .drawer-header h3{margin:0; font-size:16px;}
  .drawer-close{background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer; padding:4px;}
  .drawer-body{flex:1; overflow-y:auto; padding:8px 20px;}
  .cart-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 0; border-bottom:1px solid var(--border);
  }
  .cart-item:last-child{border-bottom:none;}
  .cart-item-name{font-size:13.5px; font-weight:600;}
  .cart-item-num{font-size:11.5px; color:var(--text-faint); margin-top:3px;}
  .cart-item-qty{display:flex; align-items:center; gap:0; border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; flex-shrink:0;}
  .cart-item-qty .qty-btn{width:28px; height:28px; font-size:14px;}
  .cart-item-qty span{width:32px; text-align:center; font-size:13px; font-weight:600;}
  .empty-cart{padding:40px 0; text-align:center; color:var(--text-faint); font-size:13.5px;}
  .drawer-footer{padding:16px 20px 20px; border-top:1px solid var(--border);}
  .field-label{font-size:12px; color:var(--text-dim); display:block; margin-bottom:6px;}
  .field-label .req{color:var(--danger);}
  input#ordererName{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:10px 12px; border-radius:var(--radius-sm); font-size:14px; margin-bottom:12px;
  }
  input#ordererName:focus{outline:2px solid var(--amber); outline-offset:1px;}
  .drawer-branch-note{font-size:12.5px; color:var(--text-dim); margin-bottom:14px;}
  .drawer-branch-note strong{color:var(--text);}
  .btn-primary{
    width:100%; background:var(--amber); color:#1B1300; border:none; border-radius:var(--radius-sm);
    padding:13px; font-size:14.5px; font-weight:700; cursor:pointer; transition:opacity .15s ease;
  }
  .btn-primary:hover{opacity:.9;}
  .btn-primary:disabled{opacity:.55; cursor:not-allowed;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:-80px; transform:translateX(-50%); z-index:60;
    background:var(--surface-3); color:var(--text); padding:13px 20px; border-radius:var(--radius-sm);
    font-size:13.5px; font-weight:500; box-shadow:0 6px 20px #00000055; border:1px solid var(--border);
    transition:bottom .25s ease; max-width:88vw;
  }
  .toast.show{bottom:24px;}
  .toast.success{border-color:var(--success);}
  .toast.error{border-color:var(--danger);}

  @media (max-width:640px){
    .topbar{padding:14px 16px 16px;}
    .tabs,.toolbar,main#content{padding-left:16px; padding-right:16px;}
    .parts-grid{grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:9px;}
    .drawer{width:100vw;}
    .cart-fab{right:16px; bottom:16px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="brand-name">ClickRobot</span>
    <span class="brand-sub">by Kru ICE</span>
  </div>
  <div class="branch-select-wrap">
    <label for="branchSelect">สาขา</label>
    <select id="branchSelect">
      <option value="">— เลือกสาขา —</option>
    </select>
  </div>
</div>

<div id="setupBannerHolder"></div>

<nav class="tabs" id="tabs"></nav>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" id="searchBox" placeholder="ค้นหาชื่อชิ้นส่วนหรือรหัส">
  </div>
</div>

<main id="content"></main>

<button class="cart-fab" id="cartBtn">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
  <span>รายการสั่งซื้อ</span>
  <span class="badge" id="cartCount">0</span>
</button>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="cartDrawer">
  <div class="drawer-header">
    <h3>รายการสั่งซื้อ</h3>
    <button class="drawer-close" id="closeDrawer">✕</button>
  </div>
  <div class="drawer-body" id="cartItems"></div>
  <div class="drawer-footer">
    <div class="drawer-branch-note">สาขา: <strong id="drawerBranch">ยังไม่ได้เลือก</strong></div>
    <label class="field-label" for="ordererName">ชื่อผู้สั่ง <span class="req">*</span></label>
    <input type="text" id="ordererName" placeholder="กรอกชื่อผู้สั่งซื้อ">
    <button class="btn-primary" id="submitOrder">ยืนยันสั่งซื้อ</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

    {id:"vex-gear-24", name:"24 Tooth Gear", num:"228-4127", img:"gears-gears", color:""},
    {id:"vex-gear-36", name:"36 Tooth Gear", num:"228-3502", img:"gears-gears", color:""},
    {id:"vex-gear-48", name:"48 Tooth Gear", num:"228-4127", img:"gears-gears", color:""},
    {id:"vex-sprocket-8", name:"8 Tooth Sprocket", num:"228-3950", img:"sprockets-and-chain-sprockets", color:""},
    {id:"vex-sprocket-16", name:"16 Tooth Sprocket", num:"228-3950", img:"sprockets-and-chain-sprockets", color:""},
    {id:"vex-sprocket-24", name:"24 Tooth Sprocket", num:"228-3950", img:"sprockets-and-chain-sprockets", color:""},
    {id:"vex-chainlink", name:"Chain Link", num:"228-3950", img:"sprockets-and-chain-chain-link", color:""}
  ]
};

const CAT_LABELS = {ev3:"EV3", wedo:"WeDo", vexiq:"VEX IQ"};

/* ---------- State ---------- */
let state = { branch:"", category:"ev3", search:"" };
let cart = {};
let totalsMap = {};
let summaryRows = [];
let drawerOpen = false;
let submitting = false;

/* ---------- Helpers ---------- */
function escapeHtml(str){
  return String(str==null?"":str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function findPart(id){
  for (const cat of Object.keys(CATALOG)){
    const found = CATALOG[cat].find(p => p.id === id);
    if (found) return Object.assign({}, found, {category:cat});
  }
  return null;
}
/* หลายแหล่งรูปเรียงลำดับความน่าเชื่อถือ — เช็ครูปในเครื่อง (โฟลเดอร์ images/ ข้าง ๆ ไฟล์นี้ ได้จาก
   การรัน download_images.py) ก่อนเป็นอันดับแรก ถ้าไม่มีค่อยลองโหลดจากอินเทอร์เน็ตไล่ทีละแหล่ง
   ก่อนจะ fallback เป็นชื่อชิ้นส่วนแบบข้อความในที่สุด */
function imgSourcesFor(part){
  const sources = [];
  if (part.elementId || part.num || part.img){
    sources.push("images/" + part.id + ".jpg");
    sources.push("images/" + part.id + ".png");
    sources.push("images/" + part.id + ".svg");
  }
  if (part.img){
    sources.push("https://content.vexrobotics.com/resources/parts-posters/iqgen2/education-kit/" + part.img + ".svg");
  }
  if (part.elementId){
    sources.push("https://www.lego.com/cdn/product-assets/element.img.lod5photo.192x192/" + part.elementId + ".jpg");
    sources.push("https://images.brickset.com/parts/" + part.elementId + ".jpg");
  }
  if (part.num && !part.img){
    sources.push("https://img.bricklink.com/ItemImage/PN/0/" + part.num + ".png");
  }
  if (part.tireNum){
    sources.push("https://img.bricklink.com/ItemImage/PN/0/" + part.tireNum + ".png");
  }
  return sources;
}
function tryNextImg(img){
  let fallbacks = [];
  try { fallbacks = JSON.parse(img.getAttribute("data-fallbacks") || "[]"); } catch(e){}
  if (fallbacks.length){
    const next = fallbacks.shift();
    img.setAttribute("data-fallbacks", JSON.stringify(fallbacks));
    img.src = next;
  } else {
    img.style.display = "none";
    img.parentElement.classList.add("img-error");
  }
}

/* ---------- Init ---------- */
function init(){
  const sel = document.getElementById("branchSelect");
  BRANCHES.forEach(b => {
    const opt = document.createElement("option");
    opt.value = b; opt.textContent = b;
    sel.appendChild(opt);
  });
  sel.addEventListener("change", e => {
    state.branch = e.target.value;
    renderDrawerBranch();
  });

  if (!apiConfigured){
    document.getElementById("setupBannerHolder").innerHTML =
      '<div class="setup-banner">ยังไม่ได้เชื่อมต่อ Google Sheet — เปิดไฟล์นี้ด้วยโปรแกรมแก้ไขข้อความ แล้วแก้ค่า <code>API_URL</code> ที่ต้นสคริปต์ให้เป็น URL ของ Apps Script ที่ deploy แล้ว (ดูวิธีตั้งค่าที่แนบมาด้วย)</div>';
  }

  buildTabs();
  renderContent();
  updateCartBadge();

  document.getElementById("searchBox").addEventListener("input", e => {
    state.search = e.target.value;
    renderContent();
  });

  document.getElementById("content").addEventListener("click", onQtyButtonClick);
  document.getElementById("content").addEventListener("input", onQtyInputChange);
  document.getElementById("cartItems").addEventListener("click", onQtyButtonClick);

  document.getElementById("cartBtn").addEventListener("click", openDrawer);
  document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
  document.getElementById("overlay").addEventListener("click", closeDrawer);
  document.getElementById("submitOrder").addEventListener("click", submitOrder);

  fetchTotals();
}

function buildTabs(){
  const cats = ["ev3","wedo","vexiq","summary"];
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = cats.map(c => {
    const label = c === "summary" ? "สรุปยอดรวม" : CAT_LABELS[c];
    const count = c === "summary" ? "" : '<span class="count">' + CATALOG[c].length + "</span>";
    return '<button class="tab' + (c===state.category?" active":"") + '" data-cat="' + c + '"><span class="dot"></span>' + label + " " + count + "</button>";
  }).join("");
  tabs.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      state.category = tab.dataset.cat;
      state.search = "";
      document.getElementById("searchBox").value = "";
      tabs.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t===tab));
      renderContent();
    });
  });
}

/* ---------- Rendering: catalog grid ---------- */
function renderContent(){
  const content = document.getElementById("content");
  if (state.category === "summary"){
    content.innerHTML = renderSummaryTable();
    return;
  }
  const list = CATALOG[state.category] || [];
  const q = state.search.trim().toLowerCase();
  const filtered = q ? list.filter(p =>
    p.name.toLowerCase().indexOf(q) !== -1 ||
    p.num.toLowerCase().indexOf(q) !== -1 ||
    (p.color||"").toLowerCase().indexOf(q) !== -1
  ) : list;

  if (filtered.length === 0){
    content.innerHTML = '<div class="empty-state">' + (
      list.length === 0
        ? "ยังไม่มีรายการชิ้นส่วนในหมวดนี้<br>ส่งภาพชีทอะไหล่มาให้เพิ่มได้ภายหลัง"
        : "ไม่พบชิ้นส่วนที่ค้นหา"
    ) + "</div>";
    return;
  }

  content.innerHTML = '<div class="parts-grid">' + filtered.map(renderPartCard).join("") + "</div>";
}

function renderPartCard(part){
  const qty = cart[part.id] || 0;
  const existing = totalsMap[part.id] || 0;
  const sources = imgSourcesFor(part);
  const first = sources[0] || "";
  const rest = sources.slice(1);
  const dot = COLOR_MAP[part.color] || "";
  return '' +
    '<div class="part-card">' +
      '<div class="part-img' + (first ? '' : ' no-image') + '">' +
        (first ? '<img src="' + first + '" data-fallbacks=\'' + JSON.stringify(rest) + '\' loading="lazy" onerror="tryNextImg(this)">' : '') +
        '<div class="fallback-label">' + escapeHtml(part.name) + '</div>' +
        (dot ? '<div class="color-dot" style="background:' + dot + '"></div>' : '') +
      '</div>' +
      '<div class="part-info">' +
        '<div class="part-name">' + escapeHtml(part.name) + '</div>' +
        '<div class="part-meta">' +
          (part.num ? '<span class="part-num mono">#' + escapeHtml(part.num) + (part.tireNum ? "+" + escapeHtml(part.tireNum) : "") + '</span>' : '') +
          (part.color ? '<span class="part-color">· ' + escapeHtml(part.color) + '</span>' : '') +
        '</div>' +
        (existing > 0 ? '<div class="part-existing">สะสมแล้ว ' + existing + ' ชิ้น</div>' : '') +
        (part.tireNum ? '<div class="bl-links"><a href="https://www.bricklink.com/v2/catalog/catalogitem.page?P=' + encodeURIComponent(part.num) + '" target="_blank" rel="noopener">ล้อ #' + escapeHtml(part.num) + ' ↗</a><a href="https://www.bricklink.com/v2/catalog/catalogitem.page?P=' + encodeURIComponent(part.tireNum) + '" target="_blank" rel="noopener">ยาง #' + escapeHtml(part.tireNum) + ' ↗</a></div>' : '') +
      '</div>' +
      '<div class="part-qty">' +
        '<button class="qty-btn" data-action="dec" data-id="' + part.id + '">–</button>' +
        '<input type="number" min="0" inputmode="numeric" class="qty-input mono" data-id="' + part.id + '" value="' + qty + '">' +
        '<button class="qty-btn" data-action="inc" data-id="' + part.id + '">+</button>' +
      '</div>' +
    '</div>';
}

function renderSummaryTable(){
  if (summaryRows.length === 0){
    return '<div class="empty-state">' + (
      apiConfigured
        ? "ยังไม่มีคำสั่งซื้อสะสม"
        : "ยังไม่ได้ตั้งค่าการเชื่อมต่อ Google Sheet — ดูคำแนะนำการตั้งค่าที่แนบมา"
    ) + '</div>';
  }
  return '' +
    '<div class="summary-wrap"><table class="summary-table"><thead><tr>' +
      "<th>ชิ้นส่วน</th><th>รหัส</th>" +
      BRANCHES.map(b => "<th>" + escapeHtml(b) + "</th>").join("") +
      "<th>รวม</th>" +
    "</tr></thead><tbody>" +
    summaryRows.map(r => '' +
      "<tr>" +
        "<td>" + escapeHtml(r.partName) + '<span class="cat-tag ' + escapeHtml(r.category) + '">' + (CAT_LABELS[r.category] || r.category) + "</span></td>" +
        '<td class="mono">' + escapeHtml(r.partNumber) + "</td>" +
        r.branchTotals.map(v => '<td class="mono">' + (v || "") + "</td>").join("") +
        '<td class="mono total-cell">' + r.grandTotal + "</td>" +
      "</tr>"
    ).join("") +
    "</tbody></table></div>";
}

/* ---------- Cart logic ---------- */
function onQtyButtonClick(e){
  const btn = e.target.closest(".qty-btn");
  if (!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  const current = cart[id] || 0;
  const next = action === "inc" ? current + 1 : Math.max(0, current - 1);
  setQty(id, next);
}
function onQtyInputChange(e){
  const input = e.target.closest(".qty-input");
  if (!input) return;
  let val = parseInt(input.value, 10);
  if (isNaN(val) || val < 0) val = 0;
  setQty(input.dataset.id, val, false);
}
function setQty(id, val, syncGridInput){
  if (syncGridInput === undefined) syncGridInput = true;
  cart[id] = val;
  if (syncGridInput){
    document.querySelectorAll('.qty-input[data-id="' + id + '"]').forEach(inp => inp.value = val);
  }
  updateCartBadge();
  if (drawerOpen) renderDrawerItems();
}
function updateCartBadge(){
  const totalQty = Object.keys(cart).reduce((sum,id) => sum + (cart[id] > 0 ? cart[id] : 0), 0);
  document.getElementById("cartCount").textContent = totalQty;
}

/* ---------- Drawer ---------- */
function openDrawer(){
  drawerOpen = true;
  document.getElementById("cartDrawer").classList.add("open");
  document.getElementById("overlay").classList.add("open");
  renderDrawerItems();
  renderDrawerBranch();
}
function closeDrawer(){
  drawerOpen = false;
  document.getElementById("cartDrawer").classList.remove("open");
  document.getElementById("overlay").classList.remove("open");
}
function renderDrawerBranch(){
  document.getElementById("drawerBranch").textContent = state.branch || "ยังไม่ได้เลือก";
}
function renderDrawerItems(){
  const items = Object.keys(cart).filter(id => cart[id] > 0);
  const container = document.getElementById("cartItems");
  if (items.length === 0){
    container.innerHTML = '<div class="empty-cart">ยังไม่ได้เลือกชิ้นส่วน<br>ปรับจำนวนในหน้ารายการเพื่อเพิ่มที่นี่</div>';
    return;
  }
  container.innerHTML = items.map(id => {
    const part = findPart(id);
    if (!part) return "";
    const qty = cart[id];
    return '' +
      '<div class="cart-item">' +
        '<div>' +
          '<div class="cart-item-name">' + escapeHtml(part.name) + "</div>" +
          '<div class="cart-item-num mono">' + (part.num ? "#" + escapeHtml(part.num) + (part.tireNum ? "+" + escapeHtml(part.tireNum) : "") : "") + (part.color ? " · " + escapeHtml(part.color) : "") + "</div>" +
        "</div>" +
        '<div class="cart-item-qty">' +
          '<button class="qty-btn" data-action="dec" data-id="' + id + '">–</button>' +
          "<span>" + qty + "</span>" +
          '<button class="qty-btn" data-action="inc" data-id="' + id + '">+</button>' +
        "</div>" +
      "</div>";
  }).join("");
}

/* ---------- Toast ---------- */
let toastTimer = null;
function showToast(msg, type){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show " + (type || "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = "toast " + (type || ""); }, 3200);
}

/* ---------- Backend sync ---------- */
async function fetchTotals(){
  if (!apiConfigured) return;
  try {
    const res = await fetch(API_URL, {method:"GET"});
    const data = await res.json();
    summaryRows = data.rows || [];
    totalsMap = {};
    summaryRows.forEach(r => { totalsMap[r.partId] = r.grandTotal; });
    renderContent();
  } catch (err){
    console.error("fetchTotals failed", err);
  }
}

async function submitOrder(){
  if (submitting) return;
  const branch = state.branch;
  const orderer = document.getElementById("ordererName").value.trim();
  const items = Object.keys(cart).filter(id => cart[id] > 0).map(id => {
    const part = findPart(id);
    return {category:part.category, partId:part.id, partName:part.name, partNumber:part.num, qty:cart[id]};
  });

  if (!branch){ showToast("กรุณาเลือกสาขาก่อนสั่งซื้อ", "error"); return; }
  if (!orderer){ showToast("กรุณากรอกชื่อผู้สั่ง", "error"); return; }
  if (items.length === 0){ showToast("ยังไม่ได้เลือกจำนวนชิ้นส่วน", "error"); return; }
  if (!apiConfigured){ showToast("ยังไม่ได้ตั้งค่าการเชื่อมต่อ Google Sheet (API_URL)", "error"); return; }

  submitting = true;
  const btn = document.getElementById("submitOrder");
  btn.disabled = true;
  btn.textContent = "กำลังบันทึก...";

  try {
    const res = await fetch(API_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({branch:branch, orderer:orderer, items:items})
    });
    const data = await res.json();
    if (data.success){
      showToast("บันทึกคำสั่งซื้อเรียบร้อยแล้ว", "success");
      cart = {};
      document.getElementById("ordererName").value = "";
      updateCartBadge();
      closeDrawer();
      renderContent();
      fetchTotals();
    } else {
      showToast("บันทึกไม่สำเร็จ: " + (data.error || "ไม่ทราบสาเหตุ"), "error");
    }
  } catch (err){
    showToast("เชื่อมต่อไม่สำเร็จ ตรวจสอบ API_URL และอินเทอร์เน็ต", "error");
  } finally {
    submitting = false;
    btn.disabled = false;
    btn.textContent = "ยืนยันสั่งซื้อ";
  }
}

init();
</script>
